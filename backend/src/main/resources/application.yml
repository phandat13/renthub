spring:
  application:
    name: renthub-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/renthub}
    username: ${DB_USERNAME:renthub}
    password: ${DB_PASSWORD:renthub}
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 30MB

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:cmVudGh1Yi1kZXYtb25seS1zZWNyZXQta2V5LXBsZWFzZS1jaGFuZ2UtaW4tcHJvZC0yMDI2}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    type: ${STORAGE_TYPE:local}
    upload-dir: ${UPLOAD_DIR:uploads}
    public-url: ${PUBLIC_URL:http://localhost:8080}
  seed:
    enabled: ${SEED_ENABLED:true}